<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Support Desk</title>
  <style>:root {
  --bg: #070b14; --panel: #0d1424; --panel2: #121b30; --line: #1e2a44;
  --text: #e6edf7; --muted: #8093b0; --accent: #38bdf8; --accent-ink: #04121d;
  --danger: #f87171; --ok: #34d399;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text); line-height: 1.5;
  background: radial-gradient(900px 420px at 12% -10%, rgb(56 189 248 / .14), transparent),
    linear-gradient(rgb(255 255 255 / .025) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgb(255 255 255 / .025) 1px, transparent 1px) 0 0 / 40px 40px, var(--bg);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.top, main { max-width: 1040px; margin: 0 auto; padding: 1rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.brand { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: .01em; }
h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
h3 { font-size: .95rem; margin: .75rem 0 .25rem; }
.muted { color: var(--muted); margin: .25rem 0 .75rem; }
.mark { width: 22px; height: 22px; border: 2px solid var(--accent); border-radius: 6px; position: relative; box-shadow: 0 0 14px rgb(56 189 248 / .55); }
.mark::after { content: ""; position: absolute; inset: 4px; background: var(--accent); border-radius: 2px; }
.pill { display: inline-flex; align-items: center; gap: .45rem; font: .78rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: .15rem .65rem; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
kbd { font: .72rem var(--mono); border: 1px solid currentColor; border-radius: 4px; padding: 0 .3rem; opacity: .7; margin-left: .4rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin: 0 0 .75rem; }
.stat { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 10px; padding: .75rem 1rem; display: flex; flex-direction: column-reverse; }
.stat dd { margin: 0; font: 700 2rem var(--mono); font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgb(56 189 248 / .35); }
.stat dt { color: var(--muted); font-size: .82rem; }
.stat.warn { border-color: rgb(248 113 113 / .6); border-top-color: var(--danger); box-shadow: 0 0 20px rgb(248 113 113 / .18); }
.stat.warn dd { color: var(--danger); text-shadow: 0 0 18px rgb(248 113 113 / .5); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .85rem 1rem; margin-bottom: 1.25rem; }
.panel h2 { font-size: .9rem; color: var(--muted); font-weight: 600; margin-bottom: .6rem; }
.mix-bar { display: flex; gap: 3px; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel2); }
.seg { background: currentColor; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .6rem; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: .4rem; }
.legend b { font: 600 .82rem var(--mono); color: var(--text); margin-left: .25rem; }

.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; }
.toolbar input { flex: 1 1 220px; }
input, select, textarea, .btn { font: inherit; color: inherit; background: #0a1120; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; }
input:hover, select:hover, .btn:hover { border-color: #33466d; }
.btn { cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; box-shadow: 0 0 16px rgb(56 189 248 / .3); }
.btn.danger { color: var(--danger); border-color: rgb(248 113 113 / .5); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: .7rem .85rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; background: var(--panel2); }
td:last-child { font: .85rem var(--mono); color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--panel2); }
.link { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
th .sort { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
th[aria-sort=ascending] .sort::after { content: " ▲"; color: var(--accent); }
th[aria-sort=descending] .sort::after { content: " ▼"; color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 2rem 0; }

.badge { display: inline-block; padding: .05rem .6rem; border-radius: 99px; font-size: .78rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  background: color-mix(in srgb, currentColor 14%, transparent); border: 1px solid color-mix(in srgb, currentColor 40%, transparent); }
.priority-low { color: #34d399; } .priority-medium { color: #fbbf24; } .priority-high { color: #fb923c; } .priority-urgent { color: var(--danger); }
.status-open { color: var(--accent); } .status-in_progress { color: #a78bfa; } .status-resolved { color: var(--ok); } .status-closed { color: var(--muted); }
.badge.overdue { color: var(--danger); font-weight: 800; }

dialog { width: min(540px, calc(100% - 2rem)); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 12px; padding: 1.25rem; box-shadow: 0 0 60px rgb(56 189 248 / .12); }
dialog::backdrop { background: rgb(3 6 12 / .7); backdrop-filter: blur(3px); }
dialog label { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .75rem; font-weight: 600; font-size: .9rem; }
dialog input, dialog textarea, dialog select { font-weight: 400; }
.desc { white-space: pre-wrap; margin: 0 0 1rem; }
.row { display: flex; gap: 1rem; } .row label { flex: 1; }
.actions { display: flex; justify-content: space-between; gap: .5rem; margin-top: .5rem; }
.error { color: var(--danger); min-height: 1.4em; margin: 0; }
.history { margin: 0 0 1rem; padding-left: 1.1rem; color: var(--muted); font: .82rem var(--mono); }

.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); display: flex; gap: .75rem; align-items: center; background: var(--panel2); border: 1px solid var(--accent); box-shadow: 0 0 24px rgb(56 189 248 / .25); padding: .6rem .9rem; border-radius: 10px; max-width: calc(100% - 2rem); }
.toast[hidden] { display: none; }
.toast .btn { padding: .2rem .6rem; }

@media (max-width: 680px) {
  thead { position: absolute; left: -9999px; }
  table, tbody, tr, td { display: block; }
  tr { padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
  td { border: 0; padding: .15rem 0; }
  td::before { content: attr(data-label) ": "; color: var(--muted); font-size: .8rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.hd-actions { display: flex; gap: .5rem; align-items: center; }
a.btn { text-decoration: none; }
/* guided demo overlay (js/demo.js) */
.d-cur, .d-cap, .d-ctl { position: fixed; inset: auto; margin: 0; pointer-events: none; overflow: visible; }
.d-cur { width: 22px; height: 22px; padding: 0; border: 2px solid #38bdf8; border-radius: 50%; background: rgb(56 189 248 / .3); box-shadow: 0 0 14px #38bdf8; transform: translate(-50%, -50%); transition: left .7s ease, top .7s ease, transform .15s; }
.d-cur.tap { transform: translate(-50%, -50%) scale(.6); }
.d-cap { left: 50%; bottom: 4.5rem; transform: translateX(-50%); width: max-content; max-width: min(90%, 640px); background: #0d1424; color: #e6edf7; border: 1px solid #38bdf8; box-shadow: 0 0 24px rgb(56 189 248 / .3); padding: .6rem 1rem; border-radius: 10px; font-weight: 600; text-align: center; }
.d-ctl { right: 1rem; bottom: 1rem; border: 0; padding: 0; background: none; pointer-events: auto; }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark"></span><h1>Support desk</h1><span class="pill"><i></i>Live <time id="clock"></time></span></div>
    <div class="hd-actions"><button id="new-btn" class="btn primary">New ticket<kbd>N</kbd></button></div>
  </header>

  <main>
    <section aria-label="Statistics"><dl id="stats" class="stats"></dl></section>
    <section class="panel" aria-label="Active workload">
      <h2>Active workload by priority</h2>
      <div id="mix-bar" class="mix-bar"></div>
      <div id="mix-legend" class="legend"></div>
    </section>

    <section aria-label="Tickets">
      <div class="toolbar">
        <label class="sr-only" for="search">Search tickets</label>
        <input id="search" type="search" placeholder="Search by title or client (press /)">
        <label class="sr-only" for="f-status">Filter by status</label>
        <select id="f-status"></select>
        <label class="sr-only" for="f-priority">Filter by priority</label>
        <select id="f-priority"></select>
        <button id="clear" class="btn">Clear filters</button>
        <button id="export" class="btn">Export CSV</button>
      </div>
      <p id="count" class="muted" aria-live="polite"></p>

      <table>
        <thead><tr><th data-sort="title" aria-sort="none"><button class="sort">Title</button></th><th data-sort="client" aria-sort="none"><button class="sort">Client</button></th><th data-sort="priority" aria-sort="none"><button class="sort">Priority</button></th><th data-sort="status" aria-sort="none"><button class="sort">Status</button></th><th data-sort="createdDate" aria-sort="none"><button class="sort">Created</button></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No tickets match. Clear the filters or create a new ticket.</p>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <h2 id="d-title"></h2>
    <p class="muted"><span id="d-client"></span> · Created <span id="d-date"></span></p>
    <p id="d-desc" class="desc"></p>
    <div class="row">
      <label>Status <select id="d-status"></select></label>
      <label>Priority <select id="d-priority"></select></label>
    </div>
    <h3>Activity</h3>
    <ul id="d-history" class="history"></ul>
    <div class="actions">
      <button id="d-delete" class="btn danger">Delete ticket</button>
      <button class="btn" data-close>Close</button>
    </div>
  </dialog>

  <dialog id="new" aria-labelledby="n-h">
    <h2 id="n-h">New ticket</h2>
    <form id="new-form" novalidate>
      <label>Title <input id="n-title" name="title" maxlength="120" required></label>
      <label>Client <input name="client" maxlength="80" required></label>
      <label>Priority <select id="n-priority" name="priority"></select></label>
      <label>Description <textarea name="description" rows="3" maxlength="1000"></textarea></label>
      <p id="new-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Create ticket</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="btn" hidden>Undo</button>
  </div>

  <script>try{localStorage.removeItem('minidesk.tickets.v1')}catch{}
const daysAgo = (n) => new Date(Date.now() - n * 864e5).toISOString();

const STATUSES = [
  { value: 'open', label: 'Open' },
  { value: 'in_progress', label: 'In progress' },
  { value: 'resolved', label: 'Resolved' },
  { value: 'closed', label: 'Closed' },
];
const PRIORITIES = [
  { value: 'low', label: 'Low' },
  { value: 'medium', label: 'Medium' },
  { value: 'high', label: 'High' },
  { value: 'urgent', label: 'Urgent' },
];

const t = (n, title, client, priority, status, days, description) => ({
  id: `seed-${n}`, title, client, priority, status, createdDate: daysAgo(days), description,
});

const SEED = [
  t(1, 'Cannot log in after password reset', 'Northwind Traders', 'urgent', 'open', 0, 'Reset email arrives but the new password is rejected on the login page.'),
  t(2, 'Invoice PDF shows wrong VAT rate', 'Brightside Dental', 'high', 'in_progress', 1, 'March invoices list 18% VAT instead of 5%. Finance needs corrected copies.'),
  t(3, 'Add export to CSV on reports page', 'Kestrel Logistics', 'low', 'open', 2, 'Feature request: export the monthly delivery report as CSV.'),
  t(4, 'Dashboard loads slowly on mobile', 'Harbor & Co', 'medium', 'in_progress', 3, 'Takes about 12 seconds on 4G. Started after last week\'s release.'),
  t(5, 'Webhook retries not firing', 'Lumen Studio', 'high', 'open', 4, 'Failed webhooks are not retried. Last successful retry was on the 12th.'),
  t(6, 'Update billing contact email', 'Alder Foods', 'low', 'resolved', 6, 'Change billing contact to accounts@alderfoods.example.'),
  t(7, 'Team member cannot see shared folder', 'Northwind Traders', 'medium', 'resolved', 8, 'Permissions look correct but the folder is hidden for one user.'),
  t(8, 'Duplicate notification emails', 'Brightside Dental', 'medium', 'closed', 12, 'Clients receive appointment reminders twice.'),
  t(9, 'Request for SSO with Okta', 'Kestrel Logistics', 'high', 'open', 15, 'Security team requires SSO before the contract renewal.'),
  t(10, 'Typo on the pricing page', 'Harbor & Co', 'low', 'closed', 20, '"Enterprize" should be "Enterprise" in the plan table.'),
];

// Hours an active ticket may stay unresolved before it counts as overdue.
const SLA_HOURS = { urgent: 24, high: 72, medium: 168, low: 336 };

const KEY = 'minidesk.tickets.v1';

function load() {
  try {
    if (new URLSearchParams(location.search).has('demo')) localStorage.removeItem(KEY); // demo starts from seed data
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch {
    /* corrupted or blocked storage: fall back to seed data */
  }
  return structuredClone(SEED);
}

let tickets = load();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(tickets));
  } catch {
    /* storage full or blocked: app keeps working in memory */
  }
}

const getAll = () => tickets;
const getById = (id) => tickets.find((x) => x.id === id);

function create({ title, client, priority, description }) {
  const ticket = {
    id: crypto.randomUUID(),
    title, client, priority, description,
    status: 'open',
    createdDate: new Date().toISOString(),
    history: [{ at: new Date().toISOString(), text: 'Ticket created' }],
  };
  tickets.unshift(ticket);
  save();
  return ticket;
}

function update(id, patch) {
  const ticket = getById(id);
  if (!ticket) return null;
  ticket.history ??= [];
  for (const [key, value] of Object.entries(patch)) {
    if (ticket[key] === value) continue; // no-op changes are not logged
    const show = (v) => String(v).replace('_', ' ');
    ticket.history.unshift({ at: new Date().toISOString(), text: `${key} ${show(ticket[key])} → ${show(value)}` });
    ticket[key] = value;
  }
  save();
  return ticket;
}

function remove(id) {
  const index = tickets.findIndex((x) => x.id === id);
  if (index < 0) return null;
  const [ticket] = tickets.splice(index, 1);
  save();
  return { ticket, index };
}

function restore({ ticket, index }) {
  tickets.splice(index, 0, ticket);
  save();
}

function isOverdue(t) {
  const active = t.status === 'open' || t.status === 'in_progress';
  return active && Date.now() - new Date(t.createdDate) > SLA_HOURS[t.priority] * 36e5;
}

function stats() {
  const by = (key, value) => tickets.filter((x) => x[key] === value).length;
  const active = tickets.filter((x) => x.status === 'open' || x.status === 'in_progress');
  return {
    total: tickets.length,
    open: by('status', 'open'),
    inProgress: by('status', 'in_progress'),
    resolved: by('status', 'resolved') + by('status', 'closed'),
    overdue: tickets.filter(isOverdue).length,
    urgentActive: active.filter((x) => x.priority === 'urgent' || x.priority === 'high').length,
  };
}

const store={getAll,getById,create,update,remove,restore,stats,isOverdue};

const $ = (sel) => document.querySelector(sel);
const label = (list, v) => list.find((x) => x.value === v)?.label ?? v;
const fmt = (iso) => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const options = (list, selected) =>
  list.map((o) => `<option value="${o.value}"${o.value === selected ? ' selected' : ''}>${o.label}</option>`).join('');

const filters = { q: '', status: '', priority: '' };
const sort = { key: 'createdDate', dir: 'desc' };
const params = new URLSearchParams(location.search); // filters survive refresh and can be shared as a link
for (const k of Object.keys(filters)) filters[k] = params.get(k) ?? '';
const RANK = { priority: { low: 0, medium: 1, high: 2, urgent: 3 }, status: { open: 0, in_progress: 1, resolved: 2, closed: 3 } };
let openId = null;
let toastTimer;

/* ---------- rendering ---------- */

function renderStats() {
  const s = store.stats();
  const items = [
    ['Total', s.total], ['Open', s.open], ['In progress', s.inProgress],
    ['Resolved or closed', s.resolved], ['Overdue', s.overdue], ['High or urgent, still active', s.urgentActive],
  ];
  $('#stats').innerHTML = items
    .map(([name, n]) => `<div class="stat${name === 'Overdue' && n ? ' warn' : ''}"><dd>${n}</dd><dt>${name}</dt></div>`)
    .join('');
}

function visibleTickets() {
  const q = filters.q.trim().toLowerCase();
  return store.getAll()
    .filter((x) => !filters.status || x.status === filters.status)
    .filter((x) => !filters.priority || x.priority === filters.priority)
    .filter((x) => !q || `${x.title} ${x.client}`.toLowerCase().includes(q))
    .sort(compare);
}

function compare(a, b) {
  const k = sort.key;
  const va = RANK[k] ? RANK[k][a[k]] : a[k].toLowerCase();
  const vb = RANK[k] ? RANK[k][b[k]] : b[k].toLowerCase();
  const r = va < vb ? -1 : va > vb ? 1 : 0;
  return sort.dir === 'asc' ? r : -r;
}

function priorityCell(x) {
  const f = document.createDocumentFragment();
  f.append(badge('priority', x.priority, PRIORITIES));
  if (store.isOverdue(x)) {
    const o = document.createElement('span');
    o.className = 'badge overdue';
    o.textContent = 'Overdue';
    f.append(' ', o);
  }
  return f;
}

function renderHistory(x) {
  $('#d-history').replaceChildren(...(x.history ?? []).slice(0, 6).map((h) =>
    Object.assign(document.createElement('li'), { textContent: `${fmt(h.at)}: ${h.text}` })));
}

function renderList() {
  const qs = new URLSearchParams(Object.entries(filters).filter(([, v]) => v));
  if (params.has('demo')) qs.set('demo', '1'); // keep demo mode across re-renders
  try { history.replaceState(null, '', qs.size ? `?${qs}` : location.pathname); } catch { /* sandboxed frame */ }
  document.querySelectorAll('th[data-sort]').forEach((th) => th.setAttribute('aria-sort',
    th.dataset.sort === sort.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'));
  const rows = visibleTickets();
  $('#count').textContent = `${rows.length} of ${store.getAll().length} tickets`;
  const body = $('#rows');
  body.replaceChildren();
  $('#empty').hidden = rows.length > 0;
  for (const x of rows) {
    const tr = document.createElement('tr');
    const title = document.createElement('button');
    title.className = 'link';
    title.textContent = x.title;
    title.addEventListener('click', () => openDetail(x.id));
    const cells = [
      title, x.client,
      priorityCell(x),
      badge('status', x.status, STATUSES),
      fmt(x.createdDate),
    ];
    cells.forEach((c, i) => {
      const td = document.createElement('td');
      td.dataset.label = ['Title', 'Client', 'Priority', 'Status', 'Created'][i];
      td.append(c);
      tr.append(td);
    });
    body.append(tr);
  }
}

function badge(kind, value, list) {
  const el = document.createElement('span');
  el.className = `badge ${kind}-${value}`;
  el.textContent = label(list, value);
  return el;
}

function renderMix() {
  const active = store.getAll().filter((x) => x.status === 'open' || x.status === 'in_progress');
  const counts = PRIORITIES.map((p) => [p, active.filter((x) => x.priority === p.value).length]);
  $('#mix-bar').innerHTML = counts.filter(([, n]) => n)
    .map(([p, n]) => `<span class="seg priority-${p.value}" style="flex:${n}" title="${p.label}: ${n}"></span>`).join('');
  $('#mix-legend').innerHTML = counts
    .map(([p, n]) => `<span class="priority-${p.value}"><i></i>${p.label}<b>${n}</b></span>`).join('');
}

function render() {
  renderStats();
  renderMix();
  renderList();
}

/* ---------- detail dialog ---------- */

function openDetail(id) {
  const x = store.getById(id);
  if (!x) return;
  openId = id;
  $('#d-title').textContent = x.title;
  $('#d-client').textContent = x.client;
  $('#d-date').textContent = fmt(x.createdDate);
  $('#d-desc').textContent = x.description || 'No description provided.';
  $('#d-status').innerHTML = options(STATUSES, x.status);
  $('#d-priority').innerHTML = options(PRIORITIES, x.priority);
  renderHistory(x);
  $('#detail').showModal();
}

$('#d-status').addEventListener('change', (e) => {
  store.update(openId, { status: e.target.value });
  render();
  renderHistory(store.getById(openId));
  announce(`Status changed to ${label(STATUSES, e.target.value)}`);
});
$('#d-priority').addEventListener('change', (e) => {
  store.update(openId, { priority: e.target.value });
  render();
  renderHistory(store.getById(openId));
  announce(`Priority changed to ${label(PRIORITIES, e.target.value)}`);
});
$('#d-delete').addEventListener('click', () => {
  const removed = store.remove(openId);
  $('#detail').close();
  render();
  if (removed) announce(`Deleted "${removed.ticket.title}"`, () => { store.restore(removed); render(); });
});

/* ---------- create dialog ---------- */

$('#new-btn').addEventListener('click', () => {
  $('#new-form').reset();
  $('#new-error').textContent = '';
  $('#n-priority').innerHTML = options(PRIORITIES, 'medium');
  $('#new').showModal();
  $('#n-title').focus();
});

$('#new-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const title = f.get('title').trim();
  const client = f.get('client').trim();
  if (!title || !client) {
    $('#new-error').textContent = 'Title and client are required.';
    return;
  }
  const t = store.create({ title, client, priority: f.get('priority'), description: f.get('description').trim() });
  $('#new').close();
  filters.q = filters.status = filters.priority = '';
  $('#search').value = $('#f-status').value = $('#f-priority').value = '';
  render();
  announce(`Created "${t.title}"`);
});

document.querySelectorAll('[data-close]').forEach((b) =>
  b.addEventListener('click', () => b.closest('dialog').close()));

/* ---------- filters ---------- */

$('#search').addEventListener('input', (e) => { filters.q = e.target.value; renderList(); });
$('#f-status').addEventListener('change', (e) => { filters.status = e.target.value; renderList(); });
$('#f-priority').addEventListener('change', (e) => { filters.priority = e.target.value; renderList(); });
$('#clear').addEventListener('click', () => {
  filters.q = filters.status = filters.priority = '';
  $('#search').value = $('#f-status').value = $('#f-priority').value = '';
  renderList();
});

/* ---------- sorting, export, shortcuts ---------- */

document.querySelectorAll('th[data-sort]').forEach((th) =>
  th.querySelector('button').addEventListener('click', () => {
    const key = th.dataset.sort;
    sort.dir = sort.key === key && sort.dir === 'asc' ? 'desc' : 'asc';
    sort.key = key;
    renderList();
  }));

$('#export').addEventListener('click', () => {
  // Prefix formula-like cells so spreadsheets don't execute them (CSV injection).
  const esc = (v) => `"${(/^[=+\-@]/.test(v) ? "'" + v : String(v)).replaceAll('"', '""')}"`;
  const rows = [['Title', 'Client', 'Priority', 'Status', 'Created'],
    ...visibleTickets().map((x) => [x.title, x.client, x.priority, x.status, x.createdDate])];
  const url = URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(',')).join('\n')], { type: 'text/csv' }));
  Object.assign(document.createElement('a'), { href: url, download: 'tickets.csv' }).click();
  URL.revokeObjectURL(url);
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector('dialog[open]') || e.target.matches('input, textarea, select')) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
  if (e.key === 'n') { e.preventDefault(); $('#new-btn').click(); }
});

/* ---------- toast with optional undo (added feature) ---------- */

function announce(message, onUndo) {
  const toast = $('#toast');
  $('#toast-msg').textContent = message;
  const undo = $('#toast-undo');
  undo.hidden = !onUndo;
  undo.onclick = () => { onUndo?.(); toast.hidden = true; };
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, onUndo ? 7000 : 3000);
}

/* ---------- init ---------- */

$('#f-status').innerHTML = '<option value="">All statuses</option>' + options(STATUSES);
$('#f-priority').innerHTML = '<option value="">All priorities</option>' + options(PRIORITIES);
$('#search').value = filters.q;
$('#f-status').value = filters.status;
$('#f-priority').value = filters.priority;
render();
const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour12: false }); };
tick();
setInterval(tick, 1000);
setInterval(render, 60000); // re-evaluate overdue tickets as time passes
</script>
<script>(() => {
  const $ = (s) => document.querySelector(s);
  let alive = true;
  const sleep = (ms) => new Promise((r) => setTimeout(() => (alive ? r() : (() => { throw 'stop'; })()), ms));
  const mk = (cls, html = '') => { const e = document.createElement('div'); e.className = cls; e.setAttribute('popover', 'manual'); e.innerHTML = html; document.body.append(e); return e; };
  const cur = mk('d-cur'), cap = mk('d-cap'), ctl = mk('d-ctl', '<button id="d-stop" class="btn primary">Stop demo</button>');
  const raise = () => [cur, cap, ctl].forEach((e) => { try { e.hidePopover(); } catch {} e.showPopover(); });
  const show = (msg) => { cap.textContent = msg; raise(); };
  async function move(el) {
    el.scrollIntoView({ block: 'nearest' }); raise();
    const r = el.getBoundingClientRect();
    cur.style.left = r.left + Math.min(r.width / 2, 60) + 'px';
    cur.style.top = r.top + r.height / 2 + 'px';
    await sleep(800);
  }
  async function click(el) { await move(el); cur.classList.add('tap'); await sleep(180); el.click(); cur.classList.remove('tap'); await sleep(500); }
  async function type(el, text) { await move(el); el.focus(); for (const ch of text) { el.value += ch; el.dispatchEvent(new Event('input', { bubbles: true })); await sleep(90); } }
  async function pick(el, v) { await move(el); el.value = v; el.dispatchEvent(new Event('change', { bubbles: true })); await sleep(500); }

  async function tour() {
    await sleep(1200);
    show('Dashboard: live counts of open, in-progress, resolved and overdue tickets'); await move($('#stats')); await sleep(2500);
    show('Search by title or client'); await type($('#search'), 'login'); await sleep(1800);
    await click($('#clear'));
    show('Filter by status'); await pick($('#f-status'), 'open'); await sleep(1600);
    show('Filter by priority'); await pick($('#f-priority'), 'urgent'); await sleep(1600);
    await click($('#clear'));
    show('Sort any column. Click Priority, then again to reverse'); await click($('th[data-sort=priority] button')); await sleep(1200);
    await click($('th[data-sort=priority] button')); await sleep(1500);
    show('Open a ticket to see its details'); await click($('#rows .link')); await sleep(1500);
    show('Change status: the dashboard updates and the activity log records it'); await pick($('#d-status'), 'in_progress'); await sleep(2200);
    show('Change priority the same way'); await pick($('#d-priority'), 'medium'); await sleep(2000);
    await click($('#detail [data-close]'));
    show('Create a ticket. Submitting empty shows a validation error'); await click($('#new-btn')); await click($('#new-form .primary')); await sleep(1800);
    show('Fill in the form'); await type($('#n-title'), 'Client cannot download invoice'); await type($('[name=client]'), 'Acme Corp'); await pick($('#n-priority'), 'urgent'); await sleep(600);
    await click($('#new-form .primary')); show('The new ticket appears in the list'); await sleep(2400);
    show('Delete a ticket'); await click($('#rows .link')); await click($('#d-delete')); await sleep(1200);
    show('Undo brings it straight back'); await click($('#toast-undo')); await sleep(2200);
    show('That is the whole app. Data is saved in the browser. Now try it yourself!');
    cur.hidePopover();
  }
  const btn = $('#d-stop');
  btn.onclick = () => { if (btn.textContent === 'Replay demo') return location.reload(); alive = false; btn.textContent = 'Replay demo'; try { cap.hidePopover(); cur.hidePopover(); } catch {} };
  tour().then(() => { btn.textContent = 'Replay demo'; }).catch((e) => { if (e !== 'stop') show('Demo paused. Use the app normally.'); });
})();
</script>
</body>
