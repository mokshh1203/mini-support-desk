<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Support Desk</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark"></span><h1>Support desk</h1><span class="pill"><i></i>Live <time id="clock"></time></span></div>
    <div class="hd-actions"><a class="btn" href="?demo">Watch demo</a><button id="new-btn" class="btn primary">New ticket<kbd>N</kbd></button></div>
  </header>

  <main>
    <section aria-label="Statistics"><dl id="stats" class="stats"></dl></section>
    <section class="panel" aria-label="Active workload">
      <h2>Active workload by priority</h2>
      <div id="mix-bar" class="mix-bar"></div>
      <div id="mix-legend" class="legend"></div>
    </section>

    <section aria-label="Tickets">
      <div class="toolbar">
        <label class="sr-only" for="search">Search tickets</label>
        <input id="search" type="search" placeholder="Search by title or client (press /)">
        <label class="sr-only" for="f-status">Filter by status</label>
        <select id="f-status"></select>
        <label class="sr-only" for="f-priority">Filter by priority</label>
        <select id="f-priority"></select>
        <button id="clear" class="btn">Clear filters</button>
        <button id="export" class="btn">Export CSV</button>
      </div>
      <p id="count" class="muted" aria-live="polite"></p>

      <table>
        <thead><tr><th data-sort="title" aria-sort="none"><button class="sort">Title</button></th><th data-sort="client" aria-sort="none"><button class="sort">Client</button></th><th data-sort="priority" aria-sort="none"><button class="sort">Priority</button></th><th data-sort="status" aria-sort="none"><button class="sort">Status</button></th><th data-sort="createdDate" aria-sort="none"><button class="sort">Created</button></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No tickets match. Clear the filters or create a new ticket.</p>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <h2 id="d-title"></h2>
    <p class="muted"><span id="d-client"></span> · Created <span id="d-date"></span></p>
    <p id="d-desc" class="desc"></p>
    <div class="row">
      <label>Status <select id="d-status"></select></label>
      <label>Priority <select id="d-priority"></select></label>
    </div>
    <h3>Activity</h3>
    <ul id="d-history" class="history"></ul>
    <div class="actions">
      <button id="d-delete" class="btn danger">Delete ticket</button>
      <button class="btn" data-close>Close</button>
    </div>
  </dialog>

  <dialog id="new" aria-labelledby="n-h">
    <h2 id="n-h">New ticket</h2>
    <form id="new-form" novalidate>
      <label>Title <input id="n-title" name="title" maxlength="120" required></label>
      <label>Client <input name="client" maxlength="80" required></label>
      <label>Priority <select id="n-priority" name="priority"></select></label>
      <label>Description <textarea name="description" rows="3" maxlength="1000"></textarea></label>
      <p id="new-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Create ticket</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="btn" hidden>Undo</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
